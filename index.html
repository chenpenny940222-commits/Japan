<style>
:root{--bg:#FFFCF6;--card:#FFFFFF;--ink:#3E3A39;--soft:#8B8580;--coral:#F7A99C;--yellow:#F8D96B;--aqua:#CFEAEC;--green:#CFE6C4;--hd:#FFF3DA;--mapbg:#FFF5E3;--water:#BFE3F2;--red:#F26B63;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-skin="sakura"]{--bg:#FFF5F7;--hd:#FFE3EA;--mapbg:#FFEFF3;--yellow:#FFC9D6;--coral:#F58FA6;--aqua:#F6DDF0;--green:#FFE9D6}
:root[data-skin="matcha"]{--bg:#F5FAF1;--hd:#E3F2D8;--mapbg:#EAF6E3;--yellow:#D5EAA8;--coral:#9CCB8E;--aqua:#D3EFEF;--green:#E6F3D3}

:root[data-theme="dark"]{--bg:#2B2826;--card:#38342F;--ink:#F3EEE6;--soft:#B3ABA0;--hd:#443E37;--mapbg:#3D3832;--water:#35566A;--aqua:#3E5659;--green:#46583E;--yellow:#BFA14A;--coral:#C97C70;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.panel{border:3px solid var(--ink);border-radius:26px;background:var(--card);padding:16px;margin-bottom:16px;box-shadow:0 6px 0 rgba(62,58,57,.12)}
.hero{background:linear-gradient(160deg,var(--hd),var(--card))}
.crew{display:flex;gap:2px;align-items:flex-end;margin-bottom:6px}.crew img{height:64px;width:auto}
h1{font-size:27px;margin:2px 0}h2{font-size:20px;margin:0}h2 small{font-size:13px;color:var(--soft);font-weight:normal}
.sub{color:var(--soft);font-size:14px;margin:2px 0 10px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:3px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:4px 14px;cursor:pointer}
.pill.y{background:var(--yellow);color:#3E3A39}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:4px;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:20px;background:var(--card);color:var(--ink);font:inherit;padding:6px 14px;text-align:left;cursor:pointer;line-height:1.3}
.tab img{height:30px;width:auto}.tab b{display:block;font-size:16px;font-weight:normal}.tab small{font-size:12px;color:var(--soft)}
.tab[aria-selected="true"]{background:var(--yellow);color:#3E3A39}.tab[aria-selected="true"] small{color:#3E3A39}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.dc{border:3px solid var(--ink);border-radius:18px;background:var(--hd);color:var(--ink);font:inherit;padding:8px;text-align:center;cursor:pointer;font-size:13px}.dc b{display:block;font-weight:normal;font-size:14px}.dc span{color:var(--soft)}
.nodes{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;margin-top:8px}
.nd{width:84px;text-align:center;font-size:12px}.nd i{display:flex;align-items:center;justify-content:center;width:62px;height:62px;margin:0 auto 2px;border:3px solid var(--ink);border-radius:50%;background:var(--yellow);color:#3E3A39;font-style:normal;font-size:28px}.ar{color:var(--soft)}
.head{display:flex;gap:12px;align-items:center}.head img{height:62px;width:auto}.head p{margin:2px 0 0;color:var(--soft);font-size:14px}
.map{padding:0;overflow:hidden}.map svg{display:block;width:100%}.map svg text{fill:#3E3A39;font-family:inherit}
.player{border-top:3px solid var(--ink);padding:12px 16px 14px;background:var(--card)}
.big{font-size:38px;line-height:1.1}.cur{font-size:17px;margin:0 0 8px}
.ctl{display:flex;align-items:center;gap:10px}
.pbtn{width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);background:var(--red);color:#fff;font-size:18px;cursor:pointer;flex:0 0 auto}
.ctl input{flex:1;min-width:0;accent-color:var(--red)}
.spd{border:3px solid var(--ink);border-radius:999px;background:var(--yellow);color:#3E3A39;font:inherit;padding:2px 14px;cursor:pointer}
.mate{border-top:3px dashed var(--soft);padding:10px 16px 12px;font-size:14px}.mate div{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.mate span{display:flex;align-items:center;gap:4px;border:3px solid var(--ink);border-radius:999px;padding:0 10px 0 4px;font-size:13px}.mate img{height:24px;width:auto}
.row{display:grid;grid-template-columns:52px 22px 1fr;gap:4px;margin-bottom:14px}
.rt{text-align:right;font-size:15px;padding-top:12px}
.dl{position:relative}.dl:before{content:"";position:absolute;left:50%;top:0;bottom:-14px;border-left:3px dotted var(--soft);transform:translateX(-50%)}.row:last-child .dl:before{bottom:0}
.dl i{position:absolute;top:15px;left:50%;width:15px;height:15px;border-radius:50%;border:3px solid var(--ink);background:var(--card);transform:translateX(-50%)}
.cd{border:3px solid var(--ink);border-radius:20px;background:var(--card);padding:10px 14px;box-shadow:0 5px 0 rgba(62,58,57,.12)}
.cd.hl{background:var(--yellow);color:#3E3A39}.cd.todo{opacity:.65}
.cd h3{margin:0;font-size:17px;font-weight:normal}.cd p{margin:2px 0 0;font-size:13px;color:var(--soft);white-space:pre-line}.cd.hl p{color:#3E3A39}
.lk{display:inline-block;margin-top:4px;font-size:14px;color:var(--ink);border-bottom:3px solid var(--coral);text-decoration:none}
.mt{display:flex;align-items:center;gap:4px;border:3px solid var(--ink);border-radius:999px;padding:0 10px 0 4px;font:inherit;font-size:13px;background:var(--card);color:var(--ink);cursor:pointer}.mt[aria-pressed="true"]{background:var(--yellow);color:#3E3A39}
.bd{display:inline-block;margin-top:6px;border:3px solid var(--ink);border-radius:12px;background:var(--red);color:#fff;padding:1px 10px;font-size:13px}
.cf{margin:8px 0 0;font-size:14px;white-space:pre-line}.cf b{font-weight:normal;color:var(--soft);display:block;font-size:12px}
.foot{text-align:center;color:var(--soft);font-size:12px;margin-top:6px}
:root[data-skin="sakura"] body{background:linear-gradient(#FFE6EE,#FFF5F7 40%)}
:root[data-skin="matcha"] body{background:linear-gradient(#E1F1D6,#F5FAF1 40%)}
.row.act .cd{background:var(--yellow);color:#3E3A39}.row.act .cd p{color:#3E3A39}.row.act .dl i{background:var(--red)}.row.past .dl i{background:var(--soft)}
.oc{display:flex;flex-direction:column;align-items:center;gap:2px}.oc .dc{width:100%}.oc .ar{line-height:1}
.tips{border-style:dashed}.tips ul{margin:8px 0 0;padding-left:20px}.tips li{margin-bottom:8px}.tips li small{display:block;color:var(--soft)}
.nt{font-size:12px;color:var(--soft);margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:88%;background:rgba(62,58,57,.92);color:#fff;border-radius:16px;padding:8px 16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}.toast.on{opacity:1}
